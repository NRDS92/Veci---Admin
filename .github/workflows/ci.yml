name: Admin CI

on:
  push:
    branches: [main, "feat/**", "feature/**", "fix/**", "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: admin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Type-check, lint, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Next.js types
        run: npx next typegen

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js with Webpack
        run: npm run build -- --webpack
